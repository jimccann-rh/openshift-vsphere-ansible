---
- name: Set kubeconfig
  set_fact:
    kubeconfig: "{{ installer.work_dir }}/auth/kubeconfig"

- name: Wait for API server to be available
  uri:
    url: "https://api.{{ cluster_domain }}:6443/healthz"
    method: GET
    status_code: [200]
    validate_certs: false
    timeout: 10
  register: api_health
  until: api_health.status == 200
  retries: 30
  delay: 10
  failed_when: false

- name: Approve pending CSRs
  shell: |
    export KUBECONFIG={{ kubeconfig }}
    oc get csr -o json | jq -r '.items[] | select(.status == {}) | .metadata.name' | xargs -I {} oc adm certificate approve {}
  register: csr_approval
  changed_when: csr_approval.stdout != ""
  failed_when: false
  retries: 10
  delay: 30

- name: Display CSR approval status
  debug:
    var: csr_approval.stdout_lines
