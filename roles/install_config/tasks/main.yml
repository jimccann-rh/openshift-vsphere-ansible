---
- name: Create work directory
  file:
    path: "{{ installer.work_dir }}"
    state: directory
    mode: '0755'

- name: Create install-config directory
  file:
    path: "{{ installer.install_config_dir }}"
    state: directory
    mode: '0755'

- name: Read pull secret
  slurp:
    src: "{{ pull_secret_path | expanduser }}"
  register: pull_secret_content
  no_log: true

- name: Generate install-config.yaml
  template:
    src: install-config.yaml.j2
    dest: "{{ installer.install_config_dir }}/install-config.yaml"
    mode: '0600'
  vars:
    pull_secret: "{{ pull_secret_content.content | b64decode }}"
  no_log: true

- name: Backup install-config.yaml
  copy:
    src: "{{ installer.install_config_dir }}/install-config.yaml"
    dest: "{{ installer.work_dir }}/install-config.yaml.backup"
    mode: '0600'
  no_log: true
