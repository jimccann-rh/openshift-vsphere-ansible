---
- name: Read bootstrap ignition config
  slurp:
    src: "{{ installer.work_dir }}/bootstrap.ign"
  register: bootstrap_ignition

- name: Create bootstrap VM in vSphere
  vmware_guest:
    hostname: "{{ vsphere.vcenter }}"
    username: "{{ vsphere.username }}"
    password: "{{ vsphere.password }}"
    validate_certs: false
    name: "{{ bootstrap.name }}"
    template: "{{ vsphere.template }}"
    datacenter: "{{ vsphere.datacenter }}"
    folder: "{{ vsphere.folder }}"
    cluster: "{{ vsphere.cluster }}"
    datastore: "{{ vsphere.datastore }}"
    resource_pool: "{{ vsphere.resource_pool | default('') }}"
    state: present
    hardware:
      memory_mb: "{{ vsphere.vm.memory }}"
      num_cpus: "{{ vsphere.vm.cpu }}"
      scsi: "{{ vsphere.vm.scsi_controller }}"
    disk:
      - size_gb: "{{ vsphere.disk.size }}"
        type: "{{ 'thin' if vsphere.disk.thin_provisioned else 'thick' }}"
    networks:
      - name: "{{ vsphere.network }}"
        device_type: "{{ vsphere.network_adapter.type }}"
        ip: "{{ bootstrap.ip }}"
        netmask: "{{ vsphere.ip_config.netmask if vsphere.ip_config.enabled else '' }}"
        gateway: "{{ vsphere.ip_config.gateway if vsphere.ip_config.enabled else '' }}"
    customization:
      hostname: "{{ bootstrap.name }}"
      dns_servers: "{{ vsphere.ip_config.dns_servers if vsphere.ip_config.enabled else [] }}"
    wait_for_ip_address: true
    wait_for_customization: true
  register: bootstrap_vm

- name: Set bootstrap VM boot order
  vmware_guest_boot_manager:
    hostname: "{{ vsphere.vcenter }}"
    username: "{{ vsphere.username }}"
    password: "{{ vsphere.password }}"
    validate_certs: false
    name: "{{ bootstrap.name }}"
    boot_order:
      - cdrom
      - disk
      - ethernet
  when: bootstrap_vm.instance.boot is defined

- name: Upload bootstrap ignition to VM
  vmware_guest_disk:
    hostname: "{{ vsphere.vcenter }}"
    username: "{{ vsphere.username }}"
    password: "{{ vsphere.password }}"
    validate_certs: false
    name: "{{ bootstrap.name }}"
    cdrom:
      type: "client"
      iso_path: "{{ installer.work_dir }}/bootstrap.ign"
  when: false  # This is a placeholder - actual ignition upload may require different method

- name: Power on bootstrap VM
  vmware_guest_powerstate:
    hostname: "{{ vsphere.vcenter }}"
    username: "{{ vsphere.username }}"
    password: "{{ vsphere.password }}"
    validate_certs: false
    name: "{{ bootstrap.name }}"
    state: powered-on
  register: bootstrap_power

- name: Wait for bootstrap VM to be ready
  wait_for:
    host: "{{ bootstrap.ip }}"
    port: 22
    delay: 30
    timeout: 600
  when: bootstrap.ip is defined
