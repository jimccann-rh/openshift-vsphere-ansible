---
- name: Install ca-certificates package (RedHat/CentOS)
  package:
    name: ca-certificates
    state: present
  when: ansible_pkg_mgr in ['yum', 'dnf']

- name: Download vCenter SSL certificate (RedHat/CentOS)
  shell: |
    echo | openssl s_client -showcerts -connect {{ vsphere.vcenter }}:{{ vcenter_ssl.port | default(443) }} 2>/dev/null | \
    openssl x509 -outform PEM > /tmp/{{ vcenter_ssl.cert_file }}
  args:
    creates: "/tmp/{{ vcenter_ssl.cert_file }}"
  register: cert_extract
  changed_when: cert_extract.rc == 0

- name: Verify certificate was extracted
  stat:
    path: "/tmp/{{ vcenter_ssl.cert_file }}"
  register: cert_file_stat

- name: Fail if certificate extraction failed
  fail:
    msg: "Failed to extract vCenter SSL certificate"
  when: not cert_file_stat.stat.exists

- name: Display certificate information
  command: openssl x509 -in /tmp/{{ vcenter_ssl.cert_file }} -noout -subject -issuer -dates
  register: cert_info
  changed_when: false

- name: Show certificate details
  debug:
    msg: "{{ cert_info.stdout_lines }}"

- name: Create certificate directory (RedHat/CentOS)
  file:
    path: "{{ vcenter_ssl.cert_dir_redhat }}"
    state: directory
    mode: '0755'

- name: Copy certificate to system trust store (RedHat/CentOS)
  copy:
    src: "/tmp/{{ vcenter_ssl.cert_file }}"
    dest: "{{ vcenter_ssl.cert_dir_redhat }}/{{ vcenter_ssl.cert_file }}"
    mode: '0644'
    remote_src: true

- name: Update certificate trust store (RedHat/CentOS)
  command: update-ca-trust extract
  changed_when: true

- name: Verify certificate is in trust store
  command: openssl verify -CAfile /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /tmp/{{ vcenter_ssl.cert_file }}
  register: cert_verify
  changed_when: false
  failed_when: false

- name: Display certificate verification result
  debug:
    msg: "Certificate verification: {{ cert_verify.stdout }}"
  when: cert_verify.rc == 0

- name: Clean up temporary certificate file
  file:
    path: "/tmp/{{ vcenter_ssl.cert_file }}"
    state: absent
